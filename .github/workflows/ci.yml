name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, bench]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential

      - name: Configure and build
        run: python3 build.py --profile ${{ matrix.profile }} --build-only

      - name: Run unit tests
        if: matrix.profile == 'dev'
        run: ctest --test-dir build/dev-debug --output-on-failure -L unit
